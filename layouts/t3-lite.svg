  <g font-size="12"><text x="29" y="24" fill="#e6e6ea">Fix login</text><text x="139" y="24" fill="#83838f">infra</text><text x="227" y="24" fill="#83838f">docs</text></g>
  <path d="M98 16l6 6M104 16l-6 6" stroke="#e6e6ea" stroke-width="1.5" stroke-linecap="round"/>
