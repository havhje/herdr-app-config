  <circle cx="468" cy="56" r="3.5" fill="#e6e6ea"/>
  <g font-family="monospace" font-size="11" fill="#a9a9b4"><text x="152" y="88">$ pi</text><text x="152" y="106">Reading src/login.ts</text><text x="152" y="124">Edited 2 files</text><text x="152" y="148" fill="#e6e6ea">Fixed: the cookie expired early.</text></g>
  <!-- Sidebar on the right: toggle at its inner edge, Spaces, Agents, footer -->
  <path d="M488 0v400" stroke="#353539"/>
  <g fill="none" stroke="#83838f" stroke-width="1.5" stroke-linejoin="round"><rect x="498" y="14" width="14" height="12" rx="3"/><path d="M507 14v12"/></g>
