  <text x="518" y="88" font-size="12" fill="#e6e6ea">app</text>
  <rect x="500" y="104" width="12" height="12" rx="3" fill="#5b8def" fill-opacity="0.18"/><text x="506" y="113" font-size="8" font-weight="700" font-family="monospace" fill="#5b8def" text-anchor="middle">I</text>
  <text x="518" y="114" font-size="12" fill="#a9a9b4">infra</text>
  <path d="M488 210h152" stroke="#353539"/>
