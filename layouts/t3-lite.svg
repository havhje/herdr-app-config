  <g font-size="11" fill="#a9a9b4"><text x="28" y="88">src</text><text x="28" y="108">tests</text><text x="28" y="128">docs</text><text x="28" y="148">README.md</text><text x="28" y="168">package.json</text></g>
  <g fill="none" stroke="#83838f" stroke-width="1.2"><path d="M17 82l3 3-3 3M17 102l3 3-3 3M17 122l3 3-3 3"/></g>
