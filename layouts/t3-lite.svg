  <rect x="613" y="271" width="14" height="14" rx="4" fill="#f0a33a" fill-opacity="0.15"/><text x="620" y="282" font-size="10" font-weight="700" fill="#f0a33a" text-anchor="middle">!</text>
  <g fill="none" stroke="#83838f" stroke-width="1.5"><circle cx="506" cy="380" r="6"/><circle cx="506" cy="380" r="2"/><rect x="523" y="373" width="14" height="6" rx="2"/><rect x="523" y="381" width="14" height="6" rx="2"/></g>
</svg>
